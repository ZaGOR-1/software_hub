<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ status_code }} — {{ title }}</title>
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <script src="/static/js/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/system.css">
  <script src="/static/js/theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти до повідомлення</a>
  <header class="system-header">
    <a class="system-brand" href="/">{{ app_name }}</a>
    <button class="theme-toggle" type="button" data-theme-toggle hidden>
      <span class="theme-toggle-icon" data-theme-icon aria-hidden="true">◐</span>
      <span class="theme-toggle-label" data-theme-label>Системна тема</span>
    </button>
  </header>
  <main id="main-content" class="system-main" tabindex="-1">
    <section class="system-card" aria-labelledby="error-title">
      <p class="system-eyebrow">{{ app_name }}</p>
      <h1 id="error-title">{{ status_code }} — {{ title }}</h1>
      <p>{{ message }}</p>
      <p class="system-muted request-id">Ідентифікатор запиту: <code>{{ request_id }}</code></p>
      <p><a href="/">Повернутися на головну</a></p>
    </section>
  </main>
</body>
</html>
