name: Container Build and Scan

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-scan-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare Compose environment
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          SOFTWARE_HUB_APP_SECRET_KEY=container-ci-app-secret-1234567890-ABCDEFG
          SOFTWARE_HUB_CSRF_SECRET=container-ci-csrf-secret-123456789-ABCDEFG
          SOFTWARE_HUB_PUBLIC_BASE_URL=http://localhost:8080
          SOFTWARE_HUB_TRUSTED_HOSTS=localhost,127.0.0.1
          SOFTWARE_HUB_STORAGE_MIN_FREE_BYTES=0
          SOFTWARE_HUB_BACKUP_MIN_FREE_BYTES=0
          ENV
          ./scripts/prepare-local.sh
          printf 'SOFTWARE_HUB_UID=%s\n' "$(id -u)" >> "$GITHUB_ENV"
          printf 'SOFTWARE_HUB_GID=%s\n' "$(id -g)" >> "$GITHUB_ENV"

      - name: Validate Compose model
        run: |
          docker compose -f docker-compose.yml config --quiet
          SOFTWARE_HUB_DOMAIN=software.example.test \
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
            config --quiet

      - name: Build application and Nginx images
        run: |
          docker build --pull --tag software-hub-app:ci .
          docker build --pull --file nginx/Dockerfile --tag software-hub-nginx:ci .

      - name: Trivy filesystem and configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy application image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: software-hub-app:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-app.sarif
          skip-setup-trivy: true

      - name: Trivy Nginx image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: software-hub-nginx:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-nginx.sarif
          skip-setup-trivy: true

      - name: Start container stack
        run: |
          SOFTWARE_HUB_APP_IMAGE=software-hub-app:ci \
          SOFTWARE_HUB_NGINX_APP_IMAGE=software-hub-nginx:ci \
            docker compose up --detach --no-build

      - name: Wait for public health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify non-root and health state
        run: |
          test "$(docker compose exec -T app id -u)" != "0"
          test "$(docker compose exec -T nginx id -u)" != "0"
          docker compose ps --format json > compose-ps.json
          docker compose exec -T app python /usr/local/bin/software-hub-healthcheck.py
          docker compose exec -T nginx /usr/local/bin/software-hub-nginx-healthcheck

      - name: Upload scan and runtime artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-security-${{ github.run_id }}
          path: |
            trivy-app.sarif
            trivy-nginx.sarif
            compose-ps.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
