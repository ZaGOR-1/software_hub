name: software-hub

x-common-security: &common-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  init: true
  restart: unless-stopped

services:
  app:
    <<: *common-security
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${SOFTWARE_HUB_PYTHON_IMAGE:-python:3.14.6-slim-bookworm}
        UV_VERSION: ${SOFTWARE_HUB_UV_VERSION:-0.10.0}
        APP_UID: ${SOFTWARE_HUB_UID:-10001}
        APP_GID: ${SOFTWARE_HUB_GID:-10001}
    image: ${SOFTWARE_HUB_APP_IMAGE:-software-hub-app:local}
    user: "${SOFTWARE_HUB_UID:-10001}:${SOFTWARE_HUB_GID:-10001}"
    env_file:
      - ${SOFTWARE_HUB_ENV_FILE:-.env}
    environment:
      SOFTWARE_HUB_FORWARDED_ALLOW_IPS: ${SOFTWARE_HUB_NGINX_IP:-172.30.0.10}
      SOFTWARE_HUB_HEALTHCHECK_HOST_HEADER: ${SOFTWARE_HUB_DOMAIN:-localhost}
      SOFTWARE_HUB_RUN_MIGRATIONS: ${SOFTWARE_HUB_RUN_MIGRATIONS:-true}
      SOFTWARE_HUB_SECURITY_HEADERS_ENABLED: "false"
      SOFTWARE_HUB_TRUSTED_PROXY_NETWORKS: ${SOFTWARE_HUB_NGINX_IP:-172.30.0.10}/32
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${SOFTWARE_HUB_DATA_ROOT:-./.runtime}/database
        target: /srv/software-hub/database
      - type: bind
        source: ${SOFTWARE_HUB_DATA_ROOT:-./.runtime}/storage
        target: /srv/software-hub/storage
      - type: bind
        source: ${SOFTWARE_HUB_DATA_ROOT:-./.runtime}/backups
        target: /srv/software-hub/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1770,uid=${SOFTWARE_HUB_UID:-10001},gid=${SOFTWARE_HUB_GID:-10001}
    stop_grace_period: 35s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      backend:
        ipv4_address: ${SOFTWARE_HUB_APP_IP:-172.30.0.20}

  nginx:
    <<: *common-security
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NGINX_IMAGE: ${SOFTWARE_HUB_NGINX_IMAGE:-nginx:1.30.4-alpine3.24}
        APP_UID: ${SOFTWARE_HUB_UID:-10001}
        APP_GID: ${SOFTWARE_HUB_GID:-10001}
    image: ${SOFTWARE_HUB_NGINX_APP_IMAGE:-software-hub-nginx:local}
    user: "${SOFTWARE_HUB_UID:-10001}:${SOFTWARE_HUB_GID:-10001}"
    environment:
      SOFTWARE_HUB_NGINX_MODE: ${SOFTWARE_HUB_NGINX_MODE:-development}
      SOFTWARE_HUB_DOMAIN: ${SOFTWARE_HUB_DOMAIN:-localhost}
      SOFTWARE_HUB_ADMIN_ACCESS_FILE: /etc/software-hub/nginx/snippets/admin-access-runtime.conf
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      - "${SOFTWARE_HUB_HTTP_BIND:-127.0.0.1}:${SOFTWARE_HUB_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${SOFTWARE_HUB_DATA_ROOT:-./.runtime}/storage/software
        target: /srv/software-hub/storage/software
        read_only: true
      - type: bind
        source: ${SOFTWARE_HUB_DATA_ROOT:-./.runtime}/certbot/www
        target: /var/www/certbot
        read_only: true
      - type: bind
        source: ${SOFTWARE_HUB_ADMIN_ACCESS_CONF:-./nginx/snippets/admin-access-open.conf}
        target: /etc/software-hub/nginx/snippets/admin-access-runtime.conf
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1770,uid=${SOFTWARE_HUB_UID:-10001},gid=${SOFTWARE_HUB_GID:-10001}
    stop_grace_period: 15s
    pids_limit: 128
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      frontend: {}
      backend:
        ipv4_address: ${SOFTWARE_HUB_NGINX_IP:-172.30.0.10}

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SOFTWARE_HUB_BACKEND_SUBNET:-172.30.0.0/24}
